# ------------------------------------------------------------------------------
# HYPRLOCK — estilo minimalista
# Fondo sólido + hora centrada. El input queda oculto hasta que empezás a tipear.
# ------------------------------------------------------------------------------

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    color = rgba(0a0b0dff)
}

# Hora — centrada
label {
    monitor =
    text = $TIME
    font_size = 92
    font_family = $font
    color = rgba(f2f3f1ff)
    position = 0, 40
    halign = center
    valign = center
}

# Fecha — debajo de la hora
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B" | sed 's/^./\U&/'
    font_size = 15
    font_family = $font
    color = rgba(9fa4a6ff)
    position = 0, -40
    halign = center
    valign = center
}

# Input — oculto hasta que se empieza a tipear
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(d99a54ee) rgba(7c5a3aee) 45deg
    check_color = rgba(6fbf8bee)
    fail_color = rgba(d4604fee)
    font_color = rgba(e6e6e1ff)
    font_family = $font
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text =
    fail_text = $PAMFAIL
    rounding = 25
    dots_spacing = 0.3
    position = 0, -150
    halign = center
    valign = center
}

# Frase random (en inglés) — abajo de todo, discreta
label {
    monitor =
    text = cmd[update:1800000] ~/.config/hypr/scripts/quote.sh
    font_size = 11
    font_family = $font
    color = rgba(6f7376ff)
    position = 0, -220
    halign = center
    valign = center
}
