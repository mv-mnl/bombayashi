# -----------------------------------------------------
# Workspaces Config
# -----------------------------------------------------

# Cambiar de Espacio de Trabajo (Workspaces 1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana activa a un Espacio de Trabajo (SUPER + SHIFT + 1-10)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Navegación rápida con rueda del ratón
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Cambiar de espacio de trabajo con SUPER + TAB / SUPER + SHIFT + TAB
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1

# Espacios especiales (SUPER + CTRL + 1-10): saltar/mostrar-ocultar apps
# que uso de vez en cuando pero no quiero en el ciclo de Super+Tab
bind = $mainMod CTRL, 1, togglespecialworkspace, s1
bind = $mainMod CTRL, 2, togglespecialworkspace, s2
bind = $mainMod CTRL, 3, togglespecialworkspace, s3
bind = $mainMod CTRL, 4, togglespecialworkspace, s4
bind = $mainMod CTRL, 5, togglespecialworkspace, s5
bind = $mainMod CTRL, 6, togglespecialworkspace, s6
bind = $mainMod CTRL, 7, togglespecialworkspace, s7
bind = $mainMod CTRL, 8, togglespecialworkspace, s8
bind = $mainMod CTRL, 9, togglespecialworkspace, s9
bind = $mainMod CTRL, 0, togglespecialworkspace, s10

# Mover la ventana activa a un espacio especial (SUPER + ALT + 1-10)
# Para traerla de vuelta a lo normal, usá SUPER + SHIFT + 1-10 (movetoworkspace)
bind = $mainMod ALT, 1, movetoworkspace, special:s1
bind = $mainMod ALT, 2, movetoworkspace, special:s2
bind = $mainMod ALT, 3, movetoworkspace, special:s3
bind = $mainMod ALT, 4, movetoworkspace, special:s4
bind = $mainMod ALT, 5, movetoworkspace, special:s5
bind = $mainMod ALT, 6, movetoworkspace, special:s6
bind = $mainMod ALT, 7, movetoworkspace, special:s7
bind = $mainMod ALT, 8, movetoworkspace, special:s8
bind = $mainMod ALT, 9, movetoworkspace, special:s9
bind = $mainMod ALT, 0, movetoworkspace, special:s10
