# -----------------------------------------------------
# Media & Screenshots Config
# -----------------------------------------------------

# Volumen (teclas multimedia)
# Nota: apuntan a hypr/scripts/audio.sh y no a @DEFAULT_AUDIO_SINK@ directo,
# porque ese sink por defecto es el virtual de EasyEffects (cosmético: su
# volumen/mute no afecta lo que en verdad suena).
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/audio.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/audio.sh down
bind   = , XF86AudioMute, exec, ~/.config/hypr/scripts/audio.sh mute-toggle

# Brillo (teclas multimedia - requiere 'brightnessctl')
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

bind = $mainMod SHIFT, S, exec, mkdir -p "$HOME/Imágenes/Capturas" && FILE="$HOME/Imágenes/Capturas/$(date +'%Y-%m-%d_%H-%M-%S').png" && grim -g "$(slurp)" "$FILE" && wl-copy < "$FILE"

# Volumen por niveles: Super+V y luego 1-5 (1=0%, 2=25%, 3=50%, 4=75%, 5=100%).
# Funciona soltando Super o manteniéndolo. Esc (o cualquier nivel) sale del modo.
bind = $mainMod, V, submap, volumen
submap = volumen
bind = , 1, exec, ~/.config/hypr/scripts/audio.sh set 0
bind = , 2, exec, ~/.config/hypr/scripts/audio.sh set 25
bind = , 3, exec, ~/.config/hypr/scripts/audio.sh set 50
bind = , 4, exec, ~/.config/hypr/scripts/audio.sh set 75
bind = , 5, exec, ~/.config/hypr/scripts/audio.sh set 100
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/audio.sh set 0
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/audio.sh set 25
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/audio.sh set 50
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/audio.sh set 75
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/audio.sh set 100
bind = , 1, submap, reset
bind = , 2, submap, reset
bind = , 3, submap, reset
bind = , 4, submap, reset
bind = , 5, submap, reset
bind = $mainMod, 1, submap, reset
bind = $mainMod, 2, submap, reset
bind = $mainMod, 3, submap, reset
bind = $mainMod, 4, submap, reset
bind = $mainMod, 5, submap, reset
bind = , escape, submap, reset
submap = reset
