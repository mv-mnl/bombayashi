# -----------------------------------------------------
# Media & Screenshots Config
# -----------------------------------------------------

# Volumen (teclas multimedia)
# Nota: apuntan a hypr/scripts/audio.sh y no a @DEFAULT_AUDIO_SINK@ directo,
# porque ese sink por defecto es el virtual de EasyEffects (cosmético: su
# volumen/mute no afecta lo que en verdad suena).
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/audio.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/audio.sh down
bind   = , XF86AudioMute, exec, ~/.config/hypr/scripts/audio.sh mute-toggle

# Brillo (teclas multimedia - requiere 'brightnessctl')
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

bind = $mainMod SHIFT, S, exec, FILE="$HOME/Imágenes/Capturas/$(date +'%Y-%m-%d_%H-%m-%S').png" && grim -g "$(slurp)" "$FILE" && wl-copy < "$FILE"
